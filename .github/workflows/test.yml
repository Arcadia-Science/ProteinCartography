name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # The 'synchronize' event means the PR was updated with new commits.
    types: [opened, reopened, labeled, synchronize]
  
  # Allow manual triggering.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -leo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cartography_test.yml
          environment-name: test-env
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true
          init-shell: bash

      - name: Cache snakemake conda envs
        uses: actions/cache@v4
        id: cache-snakemake-conda-envs
        with:
          path: .snakemake/conda
          # note: `restore-keys` are matched as a prefix of `key`, so they must share its prefix
          # (this previously began with "snakemake-conda-", which never matched anything)
          key: conda-${{ runner.os }}--${{ runner.arch }}--${{ hashFiles('envs/*.yml') }}
          restore-keys: conda-${{ runner.os }}--${{ runner.arch }}--

      - name: Create the snakemake conda envs
        if: steps.cache-snakemake-conda-envs.outputs.cache-hit != 'true'
        run: |
          # Make sure the conda env directory is empty.
          rm -rf .snakemake/conda
          # We use the `conda` frontend here because the `mamba` frontend results in errors
          # during env creation.
          snakemake \
            --configfile demo/search-mode/config_actin.yml \
            --use-conda \
            --conda-frontend conda \
            --conda-create-envs-only \
            --cores 1
        shell: micromamba-shell {0}

      - name: Run the tests
        run: make test
        shell: micromamba-shell {0}

      - name: Run the tests without mocks
        if: contains(github.event.pull_request.labels.*.name, 'run-slow-tests')
        run: make test-without-mocks
        shell: micromamba-shell {0}
